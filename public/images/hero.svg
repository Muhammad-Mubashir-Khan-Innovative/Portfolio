<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2a41" />
      <stop offset="55%" stop-color="#0f1a2b" />
      <stop offset="100%" stop-color="#080e18" />
    </linearGradient>
    <radialGradient id="spotlight" cx="0.72" cy="0.12" r="0.62">
      <stop offset="0%" stop-color="#3a4f6e" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#1b2a41" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#080e18" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4a63" />
      <stop offset="55%" stop-color="#212e42" />
      <stop offset="100%" stop-color="#141d2c" />
    </linearGradient>
    <linearGradient id="bumperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3549" />
      <stop offset="100%" stop-color="#0f1622" />
    </linearGradient>
    <radialGradient id="headlightGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff8e6" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#fff8e6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="badgeGrad" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0%" stop-color="#f0d78a" />
      <stop offset="55%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8a6a1f" />
    </radialGradient>
    <linearGradient id="reflectionFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <mask id="reflectionMask" maskUnits="userSpaceOnUse" x="0" y="700" width="1600" height="200">
      <rect x="0" y="700" width="1600" height="200" fill="url(#reflectionFade)" />
    </mask>
    <linearGradient id="floorPlane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101a2b" />
      <stop offset="100%" stop-color="#05090f" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#heroBg)" />
  <rect width="1600" height="900" fill="url(#spotlight)" />

  <g stroke="#eef2fb" stroke-width="1.5" opacity="0.03">
    <line x1="150" y1="0" x2="150" y2="700" />
    <line x1="320" y1="0" x2="320" y2="700" />
  </g>

  <rect x="0" y="700" width="1600" height="200" fill="url(#floorPlane)" />
  <ellipse cx="1150" cy="712" rx="330" ry="34" fill="#000000" opacity="0.35" />
  <line x1="0" y1="700" x2="1600" y2="700" stroke="#eef2fb" stroke-width="1" opacity="0.06" />

  <g id="carGroup">
    <!-- windshield hint -->
    <path d="M 950 415 L 1065 345 L 1235 345 L 1350 415 Z" fill="#212e42" opacity="0.7" />

    <!-- hood + fenders -->
    <rect x="850" y="400" width="600" height="180" rx="56" fill="url(#bodyGrad)" />

    <!-- lower bumper -->
    <rect x="880" y="560" width="540" height="140" rx="42" fill="url(#bumperGrad)" />

    <!-- headlights -->
    <g>
      <rect x="915" y="470" width="150" height="66" rx="24" fill="#0b1220" stroke="#3a4a63" stroke-width="2" />
      <circle cx="990" cy="503" r="34" fill="url(#headlightGlow)" />
      <rect x="935" y="494" width="110" height="12" rx="6" fill="#fff8e6" />
    </g>
    <g>
      <rect x="1235" y="470" width="150" height="66" rx="24" fill="#0b1220" stroke="#3a4a63" stroke-width="2" />
      <circle cx="1310" cy="503" r="34" fill="url(#headlightGlow)" />
      <rect x="1255" y="494" width="110" height="12" rx="6" fill="#fff8e6" />
    </g>

    <!-- grille -->
    <rect x="1080" y="460" width="140" height="150" rx="22" fill="#0b131f" stroke="#3a4a63" stroke-width="2" />
    <g stroke="#7c8ba8" stroke-width="3" opacity="0.55">
      <line x1="1095" y1="486" x2="1205" y2="486" />
      <line x1="1095" y1="504" x2="1205" y2="504" />
      <line x1="1095" y1="522" x2="1205" y2="522" />
      <line x1="1095" y1="540" x2="1205" y2="540" />
      <line x1="1095" y1="558" x2="1205" y2="558" />
      <line x1="1095" y1="576" x2="1205" y2="576" />
    </g>

    <!-- badge -->
    <circle cx="1150" cy="535" r="27" fill="#0b131f" stroke="url(#badgeGrad)" stroke-width="3" />
    <path
      d="M1139 526 H1161 L1139 544 H1161"
      fill="none"
      stroke="#d4af37"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- lower trim accent -->
    <rect x="900" y="648" width="500" height="6" rx="3" fill="#d4af37" opacity="0.85" />

    <!-- corner accent lights -->
    <rect x="892" y="590" width="8" height="46" rx="4" fill="#d4af37" opacity="0.75" />
    <rect x="1300" y="590" width="8" height="46" rx="4" fill="#d4af37" opacity="0.75" />
  </g>

  <g mask="url(#reflectionMask)" opacity="0.4">
    <g transform="translate(0 1400) scale(1 -1)">
      <use href="#carGroup" />
    </g>
  </g>

  <g opacity="0.3">
    <circle cx="1470" cy="120" r="42" fill="none" stroke="#d4af37" stroke-width="1.4" />
    <circle cx="1470" cy="120" r="3" fill="#d4af37" />
  </g>
</svg>
