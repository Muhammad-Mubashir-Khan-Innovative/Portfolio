<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16223d" />
      <stop offset="55%" stop-color="#0a1120" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>
    <radialGradient id="heroGlow" cx="0.68" cy="0.5" r="0.62">
      <stop offset="0%" stop-color="#c8383d" stop-opacity="0.16" />
      <stop offset="55%" stop-color="#b3282d" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#b3282d" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="spotGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2fb" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#eef2fb" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="floorGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#b3282d" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#b3282d" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="carBodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa4b8" />
      <stop offset="45%" stop-color="#5c667c" />
      <stop offset="100%" stop-color="#262e42" />
    </linearGradient>
    <linearGradient id="windowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3550" />
      <stop offset="100%" stop-color="#0b1220" />
    </linearGradient>
    <radialGradient id="rimGrad" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0%" stop-color="#a9b0c0" />
      <stop offset="45%" stop-color="#5c6478" />
      <stop offset="100%" stop-color="#1c2233" />
    </radialGradient>
    <radialGradient id="hubGrad" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0%" stop-color="#c2c8d6" />
      <stop offset="100%" stop-color="#2c3346" />
    </radialGradient>
    <radialGradient id="lightGlowWarm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff6e0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fff6e0" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lightGlowRed" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff5b5b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ff5b5b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="reflectionFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <mask id="reflectionMask" maskUnits="userSpaceOnUse" x="0" y="660" width="1600" height="240">
      <rect x="0" y="660" width="1600" height="240" fill="url(#reflectionFade)" />
    </mask>
    <linearGradient id="floorPlane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111b30" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#heroBg)" />
  <rect width="1600" height="900" fill="url(#heroGlow)" />

  <g stroke="#eef2fb" stroke-width="1.5" opacity="0.035">
    <line x1="180" y1="0" x2="180" y2="660" />
    <line x1="360" y1="0" x2="360" y2="660" />
    <line x1="1430" y1="0" x2="1430" y2="660" />
    <line x1="1560" y1="0" x2="1560" y2="660" />
  </g>

  <path d="M 1020 0 L 1140 0 L 1230 520 L 960 520 Z" fill="url(#spotGrad)" opacity="0.4" filter="url(#softBlur)" />
  <path d="M 1260 0 L 1380 0 L 1470 480 L 1200 480 Z" fill="url(#spotGrad)" opacity="0.28" filter="url(#softBlur)" />

  <rect x="0" y="660" width="1600" height="240" fill="url(#floorPlane)" />
  <ellipse cx="1110" cy="680" rx="430" ry="90" fill="url(#floorGlow)" />
  <line x1="0" y1="660" x2="1600" y2="660" stroke="#eef2fb" stroke-width="1" opacity="0.07" />

  <g id="carGroup">
    <line x1="850" y1="610" x2="1370" y2="610" stroke="#d13a3a" stroke-width="3" opacity="0.45" />

    <rect x="830" y="560" width="560" height="100" rx="26" fill="url(#carBodyGrad)" />
    <rect x="950" y="470" width="330" height="110" rx="46" fill="url(#carBodyGrad)" />

    <rect x="965" y="490" width="140" height="68" rx="18" fill="url(#windowGrad)" />
    <rect x="1119" y="490" width="140" height="68" rx="18" fill="url(#windowGrad)" />
    <line x1="965" y1="492" x2="1105" y2="492" stroke="#aab4c8" stroke-width="1.5" opacity="0.2" />
    <line x1="1119" y1="492" x2="1259" y2="492" stroke="#aab4c8" stroke-width="1.5" opacity="0.2" />

    <circle cx="838" cy="600" r="20" fill="url(#lightGlowWarm)" />
    <rect x="828" y="594" width="20" height="13" rx="6" fill="#fff6e0" />

    <circle cx="1382" cy="600" r="18" fill="url(#lightGlowRed)" />
    <rect x="1373" y="594" width="18" height="13" rx="6" fill="#d13a3a" />

    <g transform="translate(930 660)">
      <circle r="60" fill="none" stroke="#12172a" stroke-width="16" />
      <circle r="42" fill="url(#rimGrad)" stroke="#4a5568" stroke-width="1.5" />
      <g stroke="#4a5568" stroke-width="4" stroke-linecap="round">
        <line x1="18" y1="0" x2="38" y2="0" transform="rotate(0)" />
        <line x1="18" y1="0" x2="38" y2="0" transform="rotate(72)" />
        <line x1="18" y1="0" x2="38" y2="0" transform="rotate(144)" />
        <line x1="18" y1="0" x2="38" y2="0" transform="rotate(216)" />
        <line x1="18" y1="0" x2="38" y2="0" transform="rotate(288)" />
      </g>
      <circle r="14" fill="url(#hubGrad)" />
    </g>

    <g transform="translate(1290 660)">
      <circle r="60" fill="none" stroke="#12172a" stroke-width="16" />
      <circle r="42" fill="url(#rimGrad)" stroke="#4a5568" stroke-width="1.5" />
      <g stroke="#4a5568" stroke-width="4" stroke-linecap="round">
        <line x1="18" y1="0" x2="38" y2="0" transform="rotate(0)" />
        <line x1="18" y1="0" x2="38" y2="0" transform="rotate(72)" />
        <line x1="18" y1="0" x2="38" y2="0" transform="rotate(144)" />
        <line x1="18" y1="0" x2="38" y2="0" transform="rotate(216)" />
        <line x1="18" y1="0" x2="38" y2="0" transform="rotate(288)" />
      </g>
      <circle r="14" fill="url(#hubGrad)" />
    </g>
  </g>

  <g mask="url(#reflectionMask)" opacity="0.45">
    <g transform="translate(0 1320) scale(1 -1)">
      <use href="#carGroup" />
    </g>
  </g>

  <g opacity="0.35">
    <circle cx="1452" cy="132" r="48" fill="none" stroke="#d13a3a" stroke-width="1.4" />
    <circle cx="1452" cy="132" r="3" fill="#d13a3a" />
  </g>
</svg>
